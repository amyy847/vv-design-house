<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — VV Design House</title>
  <meta name="description" content="A project by Vanessa Victor, VV Design House.">
  <meta name="theme-color" content="#f3eee6">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    // Flags read by CSS before first paint: JS is on, and motion is allowed.
    document.documentElement.classList.add('js');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="page-project">
  <a class="skip-link label" href="#main">Skip to content</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="arrow" viewBox="0 0 14 10"><path d="M0 5h13M9 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
  </svg>

  <header class="site-header">
    <a class="site-header__brand" href="/" aria-label="Vanessa Victor design house, home"><span class="logo"></span></a>
    <nav class="site-nav" aria-label="Main">
      <a class="link-line" href="/#about">About</a>
      <a class="link-line" href="/projects">Portfolio</a>
      <a class="link-line" href="/contact">Contact</a>
    </nav>
  </header>

  <main id="main" data-header="dark"></main>

  <dialog class="lightbox" aria-label="Photo viewer">
    <div class="lightbox__top label">
      <span class="lightbox__count">01 / 01</span>
      <button class="lightbox__close link-line" type="button">Close ✕</button>
    </div>
    <figure class="lightbox__figure"><img alt=""></figure>
    <div class="lightbox__bottom label">
      <span class="lightbox__title"></span>
      <span class="slider__arrows">
        <button class="arrow-btn arrow-btn--prev" type="button" data-dir="-1" aria-label="Previous photo"><svg width="14" height="10"><use href="#arrow"/></svg></button>
        <button class="arrow-btn" type="button" data-dir="1" aria-label="Next photo"><svg width="14" height="10"><use href="#arrow"/></svg></button>
      </span>
    </div>
  </dialog>

  <!-- 6. Footer -->
  <footer class="site-footer" data-header="dark">
    <div class="footer__cta wrap">
      <p class="label">Have a space in mind?</p>
      <h2 class="footer__title">Start with a <em>conversation</em></h2>
      <a class="btn btn--solid" href="/contact">Get in touch <svg class="btn__arrow"><use href="#arrow"/></svg></a>
    </div>

    <div class="wrap">
      <hr class="rule footer__rule">
      <div class="footer__mid">
        <nav class="footer__menu" aria-label="Footer">
          <a class="link-line" href="/">Home</a>
          <a class="link-line" href="/#about">About</a>
          <a class="link-line" href="/projects">Portfolio</a>
          <a class="link-line" href="/contact">Contact</a>
        </nav>
        <div class="footer__brand">
          <span class="logo" role="img" aria-label="Vanessa Victor design house"></span>
          <small>© <span data-year>2026</span> VV Design House. All rights reserved.</small>
        </div>
        <div class="footer__place">
          <p class="label">Studios</p>
          <p>Cairo, Egypt<br>Mauritius</p>
        </div>
      </div>
      <div class="footer__bottom label">
        <a class="link-line" href="mailto:hello@vvdesignhouse.com">hello@vvdesignhouse.com</a>
        <span><button class="footer__top-btn link-line" type="button" data-back-to-top>Back to top ↑</button></span>
        <a class="link-line" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>

    <div class="footer__sketch">
      <img src="/assets/img/sketch.svg" width="1600" height="300" alt="Ink sketch: Le Morne and a villa in Mauritius, a Nile cruise ship, and a Cairo mosque with the pyramids" loading="lazy" decoding="async">
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
  <script type="module" src="/assets/js/project.js"></script>
</body>
</html>
